org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.builtInKotlin=true
# AGP 9 defaults this to true, which stops registering the legacy
# BaseExtension class that Flutter 3.47.1's own tooling still requires
# internally (NPE in PluginHandler.configurePluginDependencies). Keep
# this false until Flutter fixes that.
android.newDsl=false
